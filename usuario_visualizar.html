<!DOCTYPE html>
<!-- Página documentada: Visualizar Usuário - Hotel Pet. -->
<!-- Página de visualização de usuário. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar Usuário - Hotel Pet</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- Estrutura geral que organiza a navegação lateral e o conteúdo da página. -->
  <div class="app-shell">
    <!-- Menu lateral -->
    <aside class="sidebar">
      <!-- Marca do Hotel Pet exibida na navegação. -->
      <div class="brand">
        <img src="imagens/logo.svg" alt="Logo do Hotel Pet">
        <span>Hotel Pet</span>
      </div>
      <!-- Links para as áreas principais do sistema. -->
      <nav class="sidebar__nav" aria-label="Navegação principal">
        <a href="pets.html" class="sidebar__link">🐾 Pet</a>
        <a href="usuarios.html" class="sidebar__link is-active" aria-current="page">👤 Usuários</a>
        <a href="configuracoes.html" class="sidebar__link">⚙️ Configurações</a>
        <a href="reservas.html" class="sidebar__link">📖 Reservas</a>
      </nav>
    </aside>

    <!-- Área principal -->
    <div class="app-main">
      <!-- Cabeçalho -->
      <header class="topbar">
        <a href="perfil.html" class="topbar__user">
          <img src="imagens/avatar-joao.svg" alt="Foto de João da Silva">
          <span>João da Silva</span>
        </a>
      </header>

      <!-- Conteúdo da página -->
      <main class="page-content">
        <!-- Caminho de navegação até a página atual. -->
        <div class="breadcrumb"><a href="index.html">Home</a> / <a href="usuarios.html">Usuários</a> / Maria da Silva</div>
        <h1 class="page-title">Maria da Silva</h1>

        <!-- Ações disponíveis para os registros ou para a página. -->
        <div class="page-actions">
          <a href="usuario_editar.html" class="button button--primary">✏️ Editar usuário</a>
          <button type="button" class="button button--success">✓ Mudar status</button>
          <button type="button" class="button button--danger">🗑️ Remover</button>
        </div>

        <!-- Bloco visual que agrupa informações relacionadas. -->
        <section class="card">
          <h2>Informações do usuário</h2>
          <!-- Apresentação dos dados detalhados do perfil. -->
          <div class="profile-layout">
            <img src="imagens/avatar-maria.svg" alt="Foto de Maria da Silva" class="avatar--large">
            <div class="profile-details">
              <div class="profile-details__row"><strong>Nome</strong> Maria da Silva</div>
              <div class="profile-details__row"><strong>Email</strong> maria@pet.com</div>
              <div class="profile-details__row"><strong>Telefone</strong> (77) 98888-7777</div>
              <div class="profile-details__row"><strong>Função</strong> Funcionário</div>
              <div class="profile-details__row"><strong>Status</strong> <span class="status-badge status-badge--active">Ativo</span></div>
              <div class="profile-details__row"><strong>Criado em</strong> 19/02/2020</div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
