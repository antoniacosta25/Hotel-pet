<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Editar Perfil</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff4e6;
        }

        header {
            background-color: #f28c28;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #e66f00;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background-color: #f28c28;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #d96f00;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #e66f00;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>🐾 Hotel Pet</h1>
        <p>Editar Perfil</p>
    </header>

    <main class="container">

        <h2>Meus Dados</h2>

        <form>

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                value="Antônia"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                value="seuemail@email.com"
                required
            >

            <label for="telefone">Telefone</label>
            <input
                type="tel"
                id="telefone"
                placeholder="Digite seu telefone"
                required
            >

            <label for="senha">Nova senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite uma nova senha"
            >

            <button type="submit">
                Salvar alterações
            </button>

        </form>

        <a href="configuracoes.html" class="voltar">
            ← Voltar para configurações
        </a>

    </main>

</body>
</html>
