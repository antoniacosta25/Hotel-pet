<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Configurações</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff4e6;
        }

        header {
            background-color: #f28c28;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px #ccc;
        }

        h2 {
            color: #e66f00;
        }

        .opcao {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .opcao:last-child {
            border-bottom: none;
        }

        .opcao span {
            font-size: 17px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background-color: #f28c28;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn:hover {
            background-color: #d96f00;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🐾 Hotel Pet</h1>
        <p>Configurações</p>
    </header>

    <main class="container">

        <div class="card">
            <h2>⚙️ Preferências</h2>

            <div class="opcao">
                <span>🔔 Receber notificações</span>
                <input type="checkbox" checked>
            </div>

            <div class="opcao">
                <span>📧 Receber avisos por e-mail</span>
                <input type="checkbox" checked>
            </div>

            <div class="opcao">
                <span>📱 Receber mensagens</span>
                <input type="checkbox">
            </div>
        </div>

        <div class="card">
            <h2>🔒 Segurança</h2>

            <div class="opcao">
                <span>Alterar senha</span>
                <a href="recuperar-senha.html">Alterar</a>
            </div>

            <div class="opcao">
                <span>Editar meus dados</span>
                <a href="editar_perfil.html">Editar</a>
            </div>
        </div>

        <a href="inicio.html" class="btn">
            ← Voltar para o início
        </a>

    </main>

</body>
</html>
