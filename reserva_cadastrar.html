<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Antônia Graciela Silva Costa">
  <title>Nova Reserva - Hotel Pet</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- Casca principal: navegação lateral ao lado do conteúdo da tela. -->
  <div class="app-shell">
    <!-- Navegação principal entre os módulos do hotel. -->
    <aside class="sidebar">
      <!-- Marca clicável: retorna ao painel. -->
      <a class="brand" href="painel.html" aria-label="Hotel Pet - página inicial">
        <img src="imagens/logo.svg" alt="">
        <span>Hotel Pet</span>
      </a>
      <!-- Acesso às listas de pets, equipe, configurações e reservas. -->
      <nav class="sidebar__nav" aria-label="Navegação principal">
        <a href="pets.html" class="sidebar__link" aria-label="Pets" title="Pets"><img src="imagens/icones/pets.svg" class="nav-icon" alt=""><span>Pet</span></a>
        <a href="usuarios.html" class="sidebar__link" aria-label="Usuários" title="Usuários"><img src="imagens/icones/users.svg" class="nav-icon" alt=""><span>Usuários</span></a>
        <a href="configuracoes.html" class="sidebar__link" aria-label="Configurações" title="Configurações"><img src="imagens/icones/settings.svg" class="nav-icon" alt=""><span>Configurações</span></a>
        <a href="reservas.html" class="sidebar__link is-active" aria-current="page" aria-label="Reservas" title="Reservas"><img src="imagens/icones/reservas.svg" class="nav-icon" alt=""><span>Reservas</span></a>
      </nav>
    </aside>

    <!-- Área de trabalho ao lado do menu. -->
    <div class="app-main">
      <!-- Faixa rosa com acesso ao perfil da gerente. -->
      <header class="topbar">
        <a href="perfil.html" class="topbar__user" aria-label="Abrir perfil de Antônia Graciela Silva Costa">
          <img src="imagens/antonia-graciela-perfil.png" alt="Foto de Antônia Graciela Silva Costa">
          <span class="topbar__identity"><strong>Antônia Graciela Silva Costa</strong><small>Gerente</small></span>
        </a>
      </header>

      <!-- Conteúdo específico desta tela. -->
      <main class="page-content">
        <!-- Breadcrumb com retorno ao painel e, quando aplicável, à lista. -->
        <div class="breadcrumb"><a href="painel.html">Home</a> / <a href="reservas.html">Reservas</a> / Nova reserva</div>
        <h1 class="page-title">Nova Reserva</h1>

        <!-- Formulário desta tela; os rótulos identificam cada campo. -->
        <form action="reservas.html" method="get" class="card">
          <h2>Dados da reserva</h2>
          <div class="form-grid">
            <div class="form-field">
              <label for="pet">Pet</label>
              <select id="pet" name="pet">
                <option selected disabled>Selecione o pet</option>
                <option>Toto (Poodle) - Maria da Silva</option>
                <option>Mia (Siamês) - José da Silva</option>
                <option>Bolinha (Angorá) - Ana Souza</option>
                <option>Piu-Piu (Calopsita) - Carlos Mendes</option>
              </select>
            </div>
            <div class="form-field">
              <label for="cliente">Cliente</label>
              <input type="text" id="cliente" name="cliente" placeholder="Selecionado automaticamente">
            </div>
            <div class="form-field">
              <label for="checkin">Check-in</label>
              <input type="date" id="checkin" name="checkin">
            </div>
            <div class="form-field">
              <label for="checkout">Check-out</label>
              <input type="date" id="checkout" name="checkout">
            </div>
            <div class="form-field">
              <label for="tipo">Tipo de estadia</label>
              <select id="tipo" name="tipo">
                <option>Hotel (diária R$ 50,00)</option>
                <option>Creche (período diurno)</option>
              </select>
            </div>
            <div class="form-field">
              <label for="status">Status</label>
              <select id="status" name="status">
                <option>Pendente</option>
                <option selected>Em andamento</option>
                <option>Finalizada</option>
              </select>
            </div>
            <div class="form-field form-field--full">
              <label for="obs">Informações sobre o pet</label>
              <textarea id="obs" name="obs" placeholder="Alimentação, medicação, horários, preferências..."></textarea>
            </div>

            <div class="stay-total">
              <span>Total de 3 diárias × R$ 50,00 =</span>
              <strong>R$ 150,00</strong>
            </div>
          </div>

          <!-- Comandos disponíveis para continuar ou voltar ao módulo. -->
          <div class="page-actions">
            <button type="submit" class="button button--primary">Salvar reserva</button>
            <a href="reservas.html" class="button button--secondary">Cancelar</a>
          </div>
        </form>
      </main>
      <!-- Crédito de autoria do protótipo acadêmico. -->
      <footer class="site-footer">Autora: Antônia Graciela Silva Costa · Programação Web II (2026.2)</footer>

    </div>
  </div>
</body>
</html>
