<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-box">

            <div class="pet-icon"> <img srs="pet_0000.jpeg" alt="cachorro e gato🐾</div">

            <h1>Hotel Pet</h1>

            <p>Um lugar especial para cuidar do seu melhor amigo.</p>

            <form>
                <input 
                    type="email" 
                    placeholder="Digite seu e-mail"
                    required
                >

                <input 
                    type="password" 
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>
            </form>

            <p class="cadastro">
                Ainda não possui uma conta?
                <a href="#">Criar conta</a>
            </p>

        </section>

    </main>

</body>
</html>
