<!DOCTYPE html>
<!-- Login visual do protótipo; não cria sessão nem autentica em servidor. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesso demonstrativo ao sistema Hotel Pet.">
  <meta name="author" content="Antônia Graciela Silva Costa">
  <title>Entrar - Hotel Pet</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/login-demo.js" defer></script>
</head>
<body class="login-page">
  <!-- Cartão de acesso com marca local, identificação da conta e credenciais demonstrativas. -->
  <main class="login-card login-card--personalizado">
    <!-- A tela pública mostra somente a marca do Hotel Pet. -->
    <img src="imagens/logo.svg" alt="Logomarca Hotel Pet" class="login-brand">
    <h1>Acesse o Hotel Pet</h1>

    <!-- O script impede o envio e usa a senha apenas para avançar ao painel. -->
    <form id="login-form" novalidate>
      <div class="form-field">
        <label for="usuario">Usuário</label>
        <input type="email" id="usuario" name="usuario" value="antoniagraciela@hotmail.com" autocomplete="username" required>
      </div>
      <div class="form-field">
        <label for="senha">Senha</label>
        <div class="password-control">
          <input type="password" id="senha" value="ads2025" autocomplete="current-password" aria-describedby="senha-aviso" required>
          <button type="button" class="password-toggle" id="alternar-senha" aria-controls="senha" aria-label="Revelar senha" aria-pressed="false">Mostrar</button>
        </div>
        <small id="senha-aviso" class="login-password-note">Senha demonstrativa; não validada por servidor.</small>
      </div>
      <p class="login-feedback" id="login-feedback" role="status" aria-live="polite"></p>
      <button type="submit" class="button button--primary button--login">ENTRAR</button>
    </form>

  <!-- Crédito de autoria do protótipo acadêmico. -->
  <footer class="site-footer">Autora: Antônia Graciela Silva Costa · Programação Web II (2026.2)</footer>
  </main>
</body>
</html>
