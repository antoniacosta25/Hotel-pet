<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Editar Pet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🐾 Hotel Pet</h1>
        <p>Editar informações do Pet</p>
    </header>

    <main class="container">

        <div class="card">

            <h2>🐶 Editar Pet</h2>

            <form>

                <label for="nome">Nome do Pet</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="Meu Cachorro"
                    required
                >

                <label for="animal">Tipo de animal</label>
                <select id="animal" name="animal">
                    <option value="cachorro">🐶 Cachorro</option>
                    <option value="gato">🐱 Gato</option>
                </select>

                <label for="idade">Idade</label>
                <input
                    type="number"
                    id="idade"
                    name="idade"
                    value="2"
                    min="0"
                    required
                >

                <label for="sexo">Sexo</label>
                <select id="sexo" name="sexo">
                    <option value="macho">Macho</option>
                    <option value="femea">Fêmea</option>
                </select>

                <label for="observacoes">Observações</label>
                <textarea
                    id="observacoes"
                    name="observacoes"
                    rows="5"
                    placeholder="Digite informações sobre o seu pet"
                >Pet dócil e brincalhão.</textarea>

                <button type="submit" class="btn">
                    Salvar alterações
                </button>

            </form>

            <a href="perfil-pet.html" class="voltar">
                ← Voltar para o perfil
            </a>

        </div>

    </main>

</body>
</html>
