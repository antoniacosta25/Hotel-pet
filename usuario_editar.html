<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Antônia Graciela Silva Costa">
  <title>Editar Usuário - Hotel Pet</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- Casca principal: navegação lateral ao lado do conteúdo da tela. -->
  <div class="app-shell">
    <!-- Navegação principal entre os módulos do hotel. -->
    <aside class="sidebar">
      <!-- Marca clicável: retorna ao painel. -->
      <a class="brand" href="painel.html" aria-label="Hotel Pet - página inicial">
        <img src="imagens/logo.svg" alt="">
        <span>Hotel Pet</span>
      </a>
      <!-- Acesso às listas de pets, equipe, configurações e reservas. -->
      <nav class="sidebar__nav" aria-label="Navegação principal">
        <a href="pets.html" class="sidebar__link" aria-label="Pets" title="Pets"><img src="imagens/icones/pets.svg" class="nav-icon" alt=""><span>Pet</span></a>
        <a href="usuarios.html" class="sidebar__link is-active" aria-current="page" aria-label="Usuários" title="Usuários"><img src="imagens/icones/users.svg" class="nav-icon" alt=""><span>Usuários</span></a>
        <a href="configuracoes.html" class="sidebar__link" aria-label="Configurações" title="Configurações"><img src="imagens/icones/settings.svg" class="nav-icon" alt=""><span>Configurações</span></a>
        <a href="reservas.html" class="sidebar__link" aria-label="Reservas" title="Reservas"><img src="imagens/icones/reservas.svg" class="nav-icon" alt=""><span>Reservas</span></a>
      </nav>
    </aside>

    <!-- Área de trabalho ao lado do menu. -->
    <div class="app-main">
      <!-- Faixa rosa com acesso ao perfil da gerente. -->
      <header class="topbar">
        <a href="perfil.html" class="topbar__user" aria-label="Abrir perfil de Antônia Graciela Silva Costa">
          <img src="imagens/antonia-graciela-perfil.png" alt="Foto de Antônia Graciela Silva Costa">
          <span class="topbar__identity"><strong>Antônia Graciela Silva Costa</strong><small>Gerente</small></span>
        </a>
      </header>

      <!-- Conteúdo específico desta tela. -->
      <main class="page-content">
        <!-- Breadcrumb com retorno ao painel e, quando aplicável, à lista. -->
        <div class="breadcrumb"><a href="painel.html">Home</a> / <a href="usuarios.html">Usuários</a> / Editar usuário</div>
        <h1 class="page-title">Editar Usuário</h1>

        <!-- Formulário desta tela; os rótulos identificam cada campo. -->
       <form id="form-editar-usuario" class="card">
          <h2>Dados do usuário</h2>
          <div class="form-grid">
            <div class="form-field">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="nome" value="Juliana Santos">
            </div>
            <div class="form-field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" value="juliana.santos@pet.com">
            </div>
            <div class="form-field">
              <label for="telefone">Telefone</label>
              <input type="tel" id="telefone" name="telefone" value="(77) 98888-7777">
            </div>
            <div class="form-field">
              <label for="funcao">Função</label>
              <select id="funcao" name="funcao">
                <option>Cliente</option>
                <option selected>Funcionário</option>
                <option>Gerente</option>
              </select>
            </div>
            <div class="form-field">
              <label for="status">Status</label>
              <select id="status" name="status">
                <option selected>Ativo</option>
                <option>Inativo</option>
              </select>
            </div>
            <div class="form-field form-field--full">
              <label for="foto">Foto</label>
              <input type="file" id="foto" name="foto">
            </div>
          </div>
          <!-- Comandos disponíveis para continuar ou voltar ao módulo. -->
          <div class="page-actions">
            <button type="submit" class="button button--primary">Salvar alterações</button>
            <a href="usuarios.html" class="button button--secondary">Cancelar</a>
          </div>
        </form>
      </main>
      <!-- Crédito de autoria do protótipo acadêmico. -->
      <footer class="site-footer">Autora: Antônia Graciela Silva Costa · Programação Web II (2026.2)</footer>
    </div>
  </div>
<script>
const parametros = new URLSearchParams(window.location.search);
const emailOriginal = parametros.get("email");
const usuariosSalvos = JSON.parse(
    localStorage.getItem("hotelPetUsuarios") || "{}"
);
const usuarioAtual = usuariosSalvos[emailOriginal];
if (usuarioAtual) {
    document.getElementById("nome").value = usuarioAtual.nome;
    document.getElementById("email").value = usuarioAtual.email;
    document.getElementById("telefone").value = usuarioAtual.telefone;
    document.getElementById("funcao").value = usuarioAtual.funcao;
    document.getElementById("status").value = usuarioAtual.status;
}  
document.getElementById("form-editar-usuario")
.addEventListener("submit", function(event) {
    event.preventDefault();
    const usuario = {
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        telefone: document.getElementById("telefone").value,
        funcao: document.getElementById("funcao").value,
        status: document.getElementById("status").value
    };
    const usuarios = JSON.parse(
        localStorage.getItem("hotelPetUsuarios") || "{}"
    );
   if (emailOriginal && emailOriginal !== usuario.email) {
    delete usuarios[emailOriginal];
}
usuarios[usuario.email] = usuario;
    localStorage.setItem(
        "hotelPetUsuarios",
        JSON.stringify(usuarios)
    );
    alert("Usuário atualizado com sucesso!");
    window.location.href = "usuarios.html";
});
</script>
</body>
</html>
