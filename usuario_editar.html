<!DOCTYPE html>
<!-- Página documentada: Editar Usuário - Hotel Pet. -->
<!-- Página de edição de usuário. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Usuário - Hotel Pet</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- Estrutura geral que organiza a navegação lateral e o conteúdo da página. -->
  <div class="app-shell">
    <!-- Menu lateral -->
    <aside class="sidebar">
      <!-- Marca do Hotel Pet exibida na navegação. -->
      <div class="brand">
        <img src="imagens/logo.svg" alt="Logo do Hotel Pet">
        <span>Hotel Pet</span>
      </div>
      <!-- Links para as áreas principais do sistema. -->
      <nav class="sidebar__nav" aria-label="Navegação principal">
        <a href="pets.html" class="sidebar__link">🐾 Pet</a>
        <a href="usuarios.html" class="sidebar__link is-active" aria-current="page">👤 Usuários</a>
        <a href="configuracoes.html" class="sidebar__link">⚙️ Configurações</a>
        <a href="reservas.html" class="sidebar__link">📖 Reservas</a>
      </nav>
    </aside>

    <!-- Área principal -->
    <div class="app-main">
      <!-- Cabeçalho -->
      <header class="topbar">
        <a href="perfil.html" class="topbar__user">
          <img src="imagens/avatar-joao.svg" alt="Foto de João da Silva">
          <span>João da Silva</span>
        </a>
      </header>

      <!-- Conteúdo da página -->
      <main class="page-content">
        <!-- Caminho de navegação até a página atual. -->
        <div class="breadcrumb"><a href="index.html">Home</a> / <a href="usuarios.html">Usuários</a> / Editar usuário</div>
        <h1 class="page-title">Editar Usuário</h1>

        <!-- Formulário com os campos e a ação de envio desta tela. -->
        <form action="usuarios.html" method="get" class="card">
          <h2>Dados do usuário</h2>
          <div class="form-grid">
            <div class="form-field">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="nome" value="Maria da Silva">
            </div>
            <div class="form-field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" value="maria@pet.com">
            </div>
            <div class="form-field">
              <label for="telefone">Telefone</label>
              <input type="tel" id="telefone" name="telefone" value="(77) 98888-7777">
            </div>
            <div class="form-field">
              <label for="funcao">Função</label>
              <select id="funcao" name="funcao">
                <option>Cliente</option>
                <option selected>Funcionário</option>
                <option>Gerente</option>
              </select>
            </div>
            <div class="form-field">
              <label for="status">Status</label>
              <select id="status" name="status">
                <option selected>Ativo</option>
                <option>Inativo</option>
              </select>
            </div>
            <div class="form-field form-field--full">
              <label for="foto">Foto</label>
              <input type="file" id="foto" name="foto">
            </div>
          </div>

          <!-- Ações disponíveis para os registros ou para a página. -->
          <div class="page-actions">
            <button type="submit" class="button button--primary">Salvar alterações</button>
            <a href="usuarios.html" class="button button--secondary">Cancelar</a>
          </div>
        </form>
      </main>
    </div>
  </div>
</body>
</html>
