<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Perfil do Pet</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff4e6;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #f28c28;
            color: white;
            padding: 25px;
        }

        .perfil {
            background-color: white;
            width: 80%;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px #ccc;
        }

        .perfil img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
        }

        h2 {
            color: #e66f00;
        }

        .dados {
            text-align: left;
            margin: 20px;
            font-size: 18px;
            line-height: 1.8;
        }

        .btn {
            display: inline-block;
            background-color: #f28c28;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 8px;
        }

        .btn:hover {
            background-color: #d96f00;
        }
    </style>
</head>

<body>

    <header>
        <h1>🐾 Hotel Pet</h1>
        <p>Perfil do meu Pet</p>
    </header>

    <div class="perfil">

        <img src="pet 0000.jpeg" alt="Foto do pet">

        <h2>Meu Cachorro 🐶</h2>

        <div class="dados">
            <p><strong>Nome:</strong> Meu Cachorro</p>
            <p><strong>Animal:</strong> Cachorro</p>
            <p><strong>Idade:</strong> 2 anos</p>
            <p><strong>Sexo:</strong> Macho</p>
            <p><strong>Observações:</strong> Pet dócil e brincalhão.</p>
        </div>

        <a href="pets.html" class="btn">← Voltar</a>
        <a href="reservas.html" class="btn">Fazer reserva</a>

    </div>

</body>
</html>
