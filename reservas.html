<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Reservas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="cabecalho">
        <h1>🐾 Hotel Pet</h1>

        <nav>
            <a href="inicio.html">Início</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="reservas.html">Reservas</a>
            <a href="servicos.html">Serviços</a>
        </nav>
    </header>

    <main class="pagina">

        <section class="caixa">

            <h2>📅 Fazer uma Reserva</h2>

            <p>
                Preencha os dados abaixo para reservar uma hospedagem
                para o seu pet.
            </p>

            <form>

                <label for="nome">Nome do responsável:</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite seu nome" required>

                <label for="pet">Nome do pet:</label>
                <input type="text" id="pet" name="pet"
                       placeholder="Digite o nome do seu pet" required>

                <label for="tipo">Tipo de pet:</label>
                <select id="tipo" name="tipo">
                    <option value="">Selecione</option>
                    <option value="cachorro">Cachorro 🐶</option>
                    <option value="gato">Gato 🐱</option>
                </select>

                <label for="entrada">Data de entrada:</label>
                <input type="date" id="entrada" name="entrada" required>

                <label for="saida">Data de saída:</label>
                <input type="date" id="saida" name="saida" required>

                <label for="observacoes">Observações:</label>
                <textarea id="observacoes" name="observacoes"
                          placeholder="Digite alguma informação sobre seu pet"></textarea>

                <button type="submit">
                    Confirmar Reserva
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 Hotel Pet - Cuidando de quem você ama 🐾</p>
    </footer>

</body>

</html>
